name: Marketing verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_YRDLY_GOOGLE_MEASUREMENT: 'legacy'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:attribution
      - run: pnpm lint
      - run: pnpm build
      - name: Scan legacy web patterns with Google Modern Web Guidance
        if: always()
        run: |
          mkdir -p .modern-web-guidance
          set +e
          npx --yes modern-web-guidance@latest legacy-scan . --json > .modern-web-guidance/scan.json 2> .modern-web-guidance/scan.stderr
          echo $? > .modern-web-guidance/exit-code
          exit 0
      - name: Upload Modern Web Guidance scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modern-web-guidance-legacy-scan
          path: .modern-web-guidance/
          retention-days: 7
